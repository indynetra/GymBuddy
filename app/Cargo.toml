[package]
name = "gymbuddy"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["lib", "cdylib"]

[[bin]]
name = "gymbuddy"
path = "src/main.rs"

[dependencies]
gymbuddy-core = { path = "../core" }

[target.'cfg(not(target_os = "android"))'.dependencies]
slint = "1.19"

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "backend-android-activity-06"] }

[build-dependencies]
slint-build = "1.19"
